[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcl-report-data"
version = "1.0.6"
description = "为 Agent Skills 准备按修订版本保存的 Warcraft Logs 团队副本数据集"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE.md"}
authors = [{name = "Yarnus"}]
dependencies = []

[project.scripts]
wcl-report-data = "wcl_report_data.__main__:main"

[tool.setuptools.packages.find]
include = ["wcl_report_data*"]
