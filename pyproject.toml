[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcl-raid-coach"
version = "3.0.0"
description = "为 Agent Skills 准备 Warcraft Logs 团队副本证据、复盘和攻略"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE.md"}
authors = [{name = "Yarnus"}]
dependencies = []

[project.scripts]
wcl-raid-coach = "wcl_raid_coach.__main__:main"

[tool.setuptools.packages.find]
include = ["wcl_raid_coach*"]
