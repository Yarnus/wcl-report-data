[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcl-report-data"
version = "1.0.0"
description = "Prepare revisioned Warcraft Logs raid datasets for Agent Skills"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Yarnus"}]
dependencies = []

[project.scripts]
wcl-report-data = "wcl_report_data.__main__:main"

[tool.setuptools.packages.find]
include = ["wcl_report_data*"]
